; -------------------------------------------- ОБЩИЙ HANDLING ТРАНСПОРТНЫХ СРЕДСТВ --------------------------------------------
;
;     ПАРАМЕТР                              ОПИСАНИЕ
;
;  1  Handling name							Имя хендлинга. Допускается не более 15 знаков!
;  2  Mass									Масса транспортного средства (100...50000)
;  3  Turn Mass								Масса, используемая для вычисления силы вращения
;  4  Drag Multiplier						Коэффициент аэродинамического сопротивления (0.0...20.0)
;  5  Center of Mass X						Центр массы по оси X
;  6  Center of Mass Y						Центр массы по оси Y
;  7  Center of Mass Z						Центр массы по оси Z (вверх/вниз)
;  8  Percent Submerged						Процент погружения в воду для утопления (10...120)
;  9  Traction Multiplier					Коэффициент сцепления шин (0.5...2.0)
;  10 Traction Loss							Коэффициент потери сцепления (0.5...2.0)
;  11 Traction Bias							Распределение сцепления (0.1...0.6)
;  12 Number of Gears						Количество передач
;  13 Max Velocity							Максимальная скорость
;  14 Engine Acceleration					Ускорение двигателя
;  15 Engine Inertia						Инерция двигателя (0.0...250.0)
;  16 Drive Type							Тип привода (F - передний, R - задний, 4 - полный)
;  17 Engine Type							Тип двигателя (P - бензиновый, D - дизельный, E - электрический)
;  18 Brake Deceleration					Замедление при торможении (1.0...20.0)
;  19 Brake Bias							Распределение тормозного усилия (0.0 - задняя, 0.5 - равномерно, 1.0 - передняя)
;  20 ABS									Наличие ABS (0 - нет, 1 - есть)
;  21 Steering Lock							Максимальный угол поворота колес (10.0...40.0)
;  22 Suspension Force Level				Жесткость подвески (влияет на высоту подвески)
;  23 Suspension Damping Level				Уровень демпфирования подвески (длительность качки корпуса)
;  24 Suspension Speed Damping Compression	Коэффициент прыгучести на скорости
;  25 Suspension Upper Limit				Амплитуда сжатия пружин (0.1...0.5)
;  26 Suspension Lower Limit				Амплитуда сжатия пружин (-0.01...-0.5)
;  27 Suspension Bias						Смещение для высот зада-переда (0.0...0.6)
;  28 Suspension Anti-Dive Multiplier		Коэффициент предотвращения наклонов (0.0...0.6)
;  29 Seat Offset Distance					Смещенvие сиденья от центра
;  30 Collision Damage Multiplier			Коэффициент повреждений (0.2...0.8, неразбиваемая 0.01)
;  31 Monetary Value						Стоимость транспортного средства (1...100000)
;  32 Model Flags							Флаги модели
;  33 Handling Flags						Флаги особенностей управления
;  34 Front Lights							Тип передних фар (0 - горизонтальный, 1 - маленький, 2 - большой, 3 - вертикальный)
;  35 Rear Lights							Тип задних фар (0 - горизонтальный, 1 - маленький, 2 - большой, 3 - вертикальный)
;  36 Anim Group							Группа анимаций при посадке в машину
